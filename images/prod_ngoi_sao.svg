<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg_star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="box_star" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow_star" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg_star)"/>
  <circle cx="250" cy="250" r="170" fill="#ffffff" opacity="0.65"/>
  <ellipse cx="250" cy="420" rx="105" ry="18" fill="#86efac" opacity="0.5"/>
  
  <g filter="url(#shadow_star)">
    <rect x="160" y="130" width="180" height="260" rx="14" fill="url(#box_star)"/>
    <rect x="170" y="140" width="160" height="240" rx="10" fill="#ffffff"/>
    
    <path d="M 170 140 L 330 140 L 330 205 L 170 205 Z" fill="#166534"/>
    <text x="250" y="170" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">VINAMILK</text>
    <text x="250" y="195" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#fef08a" text-anchor="middle">NGÔI SAO PHƯƠNG NAM</text>
    
    <!-- Big Yellow Star -->
    <polygon points="250,215 258,235 280,235 262,248 269,270 250,256 231,270 238,248 220,235 242,235" fill="#eab308"/>
    
    <text x="250" y="305" font-family="'Inter', sans-serif" font-weight="800" font-size="15" fill="#0f172a" text-anchor="middle">SỮA ĐẶC CÓ ĐƯỜNG</text>
    <text x="250" y="330" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#16a34a" text-anchor="middle">Hộp Giấy 1.284g</text>
    <text x="250" y="360" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#64748b" text-anchor="middle">Chuyên Pha Cà Phê &amp; Làm Bánh</text>
  </g>
</svg>
