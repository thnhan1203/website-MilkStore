  </defs>
  <rect width="500" height="500" fill="url(#bg_th)"/>
  <circle cx="250" cy="250" r="170" fill="#ffffff" opacity="0.65"/>
  <ellipse cx="250" cy="420" rx="95" ry="18" fill="#cbd5e1" opacity="0.6"/>
  
