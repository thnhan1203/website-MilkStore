    <rect x="175" y="110" width="150" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="220" y="80" width="60" height="30" rx="8" fill="#0284c7"/>
    
    <path d="M 175 110 L 325 110 L 325 180 L 175 180 Z" fill="url(#th_pack)"/>
    <text x="250" y="155" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">TH</text>
    
    <text x="250" y="225" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#0284c7" text-anchor="middle">true MILK</text>
    <text x="250" y="255" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#0f172a" text-anchor="middle">SỮA TƯƠI TIỆT TRÙNG</text>
    <text x="250" y="280" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#64748b" text-anchor="middle">Ít Đường - 1 Lít</text>
    
