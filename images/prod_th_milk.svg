      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow_th" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.15"/>
